name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older run irrelevant. Cancel it rather than
# paying for both — except on the default branch, where every commit's result is a record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/claude/worldgraph-resilience-platform-5bcaxi' }}

permissions:
  contents: read

env:
  # Every job runs with no credentials at all. This is not only hygiene: it is the
  # assertion that WorldGraph's demo path genuinely needs none, which is a product
  # requirement (docs/BASELINE_AUDIT.md ADR-2/ADR-3), not merely a CI convenience.
  WORLDGRAPH_RUN_MODE: DEMO

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests

      - name: Tests (pytest)
        working-directory: backend
        run: pytest -q --junit-xml=../test-results/backend-junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          if-no-files-found: ignore

  frontend:
    name: Frontend — typecheck, unit & build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # Playwright's browser download is handled by its own job; skip it here so the
        # typecheck/build job does not pay for a browser it never launches.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  e2e:
    name: End-to-end — hero demo in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A browser run is expensive; there is no point paying for it when the units are red.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        # E2E runs against the production bundle, not the dev server: it is the artifact
        # users receive, and it starts fast enough to be worth waiting for.
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        env:
          WORLDGRAPH_DATABASE_PATH: ":memory:"
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          # Poll rather than sleep: a fixed sleep is either flaky or wasteful, and the
          # health endpoint tells us exactly when the world model has loaded.
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "backend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "backend failed to start"; cat "$RUNNER_TEMP/backend.log"; exit 1

      - name: Run E2E suite
        working-directory: frontend
        env:
          WORLDGRAPH_E2E_COMMAND: "npm run preview -- --port 5173 --strictPort"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: ${{ runner.temp }}/backend.log
          if-no-files-found: ignore
