name: Security

on:
  push:
    # The default branch only. A change on any other branch reaches CI through its pull
    # request, and listening for both events ran the entire suite twice for every commit
    # on a branch with a PR open — including the browser job, the most expensive one we
    # have, which was paid for twice and proved the same thing both times.
    #
    # Concurrency does not collapse them: a push is `refs/heads/<branch>` and a pull
    # request is `refs/pull/<n>/merge`, so the two runs sit in different groups by
    # construction.
    #
    # The cost is real and accepted: a branch pushed without a pull request now gets no
    # run at all. Use `workflow_dispatch` to check one deliberately.
    branches: ["claude/worldgraph-resilience-platform-5bcaxi"]
  pull_request:
  schedule:
    # Weekly, so a dependency advisory published after merge is still caught.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-secrets-in-bundle:
    name: No credentials reach the browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend with decoy credentials in the environment
        working-directory: frontend
        # The point of the decoys: if any build step ever starts inlining process.env,
        # these strings appear in the bundle and the grep below fails. A build with a
        # clean environment could not detect that regression.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          WORLDGRAPH_ANTHROPIC_API_KEY: "sk-ant-CANARY-must-never-be-bundled"
          AZURE_CLIENT_SECRET: "azure-CANARY-must-never-be-bundled"
          AZURE_TENANT_ID: "tenant-CANARY-must-never-be-bundled"
        run: |
          npm ci
          npm run build

      - name: Assert no canary or credential shape is present
        working-directory: frontend
        run: |
          set -euo pipefail
          fail=0
          for needle in "CANARY-must-never-be-bundled" "sk-ant-" "AZURE_CLIENT_SECRET" "client_secret"; do
            if grep -rIF -- "$needle" dist/ >/dev/null 2>&1; then
              echo "::error::'$needle' found in the built frontend bundle"
              grep -rIFl -- "$needle" dist/ || true
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Bundle is clean: no credential-shaped string present."

  frontend-has-no-cloud-sdk:
    name: Cloud SDKs stay server-side
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert the frontend imports no cloud or model SDK
        run: |
          set -euo pipefail
          # Azure/AWS/GCP SDKs and the Anthropic SDK belong in the backend. An import in
          # frontend/src is the shape of a credential leak before it becomes one.
          if grep -rnE "from ['\"]@azure/|from ['\"]@aws-sdk/|from ['\"]@google-cloud/|from ['\"]@anthropic-ai/" frontend/src; then
            echo "::error::A cloud or model SDK is imported in the frontend"
            exit 1
          fi
          # The backend owns credential custody; the client talks to same-origin /api.
          if grep -rniE "DefaultAzureCredential|AZURE_CLIENT_SECRET|ANTHROPIC_API_KEY" frontend/src; then
            echo "::error::A credential identifier appears in frontend source"
            exit 1
          fi
          echo "Frontend source is free of cloud SDKs and credential identifiers."

  azure-adapter-is-read-only:
    name: The Azure adapter cannot write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert no management-plane write client or secret client is reachable
        run: |
          set -euo pipefail
          # WorldGraph imports exactly one Azure client — Resource Graph, query only. A
          # management client or a Key Vault secret client appearing anywhere in the
          # backend is the shape of a write capability before it becomes one, and §4 and
          # §17 of the product brief forbid both outright.
          if grep -rnE "ResourceManagementClient|ComputeManagementClient|begin_(create|delete|update|restart|start|deallocate)|SecretClient|KeyClient|CertificateClient" backend/app; then
            echo "::error::A write-capable or secret-reading Azure client appears in the backend"
            exit 1
          fi
          echo "Azure access is query-only: no write client, no secret client."

  azure-extras-import:
    name: The Azure SDK extra actually imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The mirror of the job below. That one proves WorldGraph runs *without* the cloud
      # SDK; nothing proved the SDK could be installed and imported at all — and it could
      # not. The pinned azure-mgmt-resourcegraph 8.0.0 does `from six import
      # with_metaclass` without declaring `six`, so a clean install of this file produced
      # a package that raised ModuleNotFoundError on import. Anyone following the live
      # connector instructions hit it, and the adapter reported it as "Azure SDK is not
      # installed" — telling them to run the command they had just run.
      - name: Install ONLY the optional Azure extras, in a clean environment
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-azure.txt

      - name: Import exactly what the adapter imports
        working-directory: backend
        run: |
          python - <<'EOF'
          from azure.identity import DefaultAzureCredential
          from azure.mgmt.resourcegraph import ResourceGraphClient
          from azure.mgmt.resourcegraph.models import QueryRequest, QueryRequestOptions
          print("all four symbols import cleanly")
          EOF

      - name: The adapter builds a real request with them
        working-directory: backend
        # Constructing the request object is as far as this can go without a subscription:
        # it proves the SDK's model classes accept the shape the paging loop builds.
        run: |
          pip install -r requirements.txt
          python - <<'EOF'
          from app.adapters.azure_inventory import PAGE_SIZE, _request_factory
          request = _request_factory()("00000000-0000-0000-0000-000000000000", skip_token="tok")
          assert type(request).__name__ == "QueryRequest", type(request)
          assert request.options.top == PAGE_SIZE
          assert request.options.skip_token == "tok"
          print("adapter builds a real QueryRequest:", type(request).__name__)
          EOF

  runs-without-cloud-sdks:
    name: WorldGraph runs with no cloud SDK installed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install without the optional Azure extras
        working-directory: backend
        # requirements-azure.txt is deliberately NOT installed. The product must start,
        # test and demo with no cloud account and no cloud SDK; a hard dependency on
        # azure-identity would make the demo unreproducible for anyone without one.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Assert the app imports and the suite passes anyway
        working-directory: backend
        run: |
          set -euo pipefail
          python -c "import azure" 2>/dev/null && { echo "::error::azure is installed; this job must run without it"; exit 1; } || true
          python -c "import app.main, app.adapters.azure_inventory, app.services.workspaces"
          python -m pytest -q

  no-committed-env:
    name: No environment file is committed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::An environment file is tracked in git"
            exit 1
          fi
          echo "No .env file is tracked."

  dependency-audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python advisories (pip-audit)
        working-directory: backend
        # Advisory feeds move independently of this repository, so a new advisory must not
        # turn every unrelated PR red. Reported, not enforced; the weekly schedule is what
        # makes it visible.
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict || true

      - name: npm advisories
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high || true
